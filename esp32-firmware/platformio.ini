[env:seeed_xiao_esp32s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; XIAO ESP32-S3 estándar: 8 MB de flash QIO y SIN PSRAM.
; El board de PlatformIO describe la variante con PSRAM octal (qio_opi +
; -DBOARD_HAS_PSRAM). Si se deja así, el bootloader se compila esperando
; PSRAM octal y la placa estándar no arranca. Aquí se corrige a qio_qspi y se
; retira el flag por build_unflags.
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

build_unflags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

lib_deps =
    links2004/WebSockets@^2.4.1
    olikraus/U8g2@^2.35.7

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
