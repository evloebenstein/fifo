name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - 'android-app/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-app/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

jobs:
  ci-green:
    name: CI green
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile, test and assemble debug
        working-directory: android-app
        run: ./gradlew compileDebugKotlin testDebugUnitTest assembleDebug
